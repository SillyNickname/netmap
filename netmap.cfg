[server]
host = 0.0.0.0
port = 8080
secret_key = netmap-secret-key-change-in-production

[poller]
# Polling interval in seconds
interval_seconds = 60
# Number of parallel ping workers / threads
ping_threads = 20
# Ping timeout in seconds
ping_timeout = 2
# Number of packets to send per ping
ping_count = 1

[history]
# History retention in hours (minimum 24)
retention_hours = 48

[database]
hosts_db = data/hosts.db
history_db = data/history.db
