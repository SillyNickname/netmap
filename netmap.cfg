[server]
host = 0.0.0.0
port = 8080
secret_key = netmap-secret-key-change-in-production
url_prefix = 

[poller]
interval_seconds = 300
ping_threads = 20
ping_timeout = 2
ping_count = 2

[history]
retention_hours = 96

[database]
hosts_db = data/hosts.db
history_db = data/history.db

[speedtest]
# Enable built-in network speed test module
enabled = true
# Target server URL for speedtest measurements.
# Examples:
#   - Empty string ("") = Built-in NetMap speedtest engine on this server (default)
#   - Remote standalone daemon proxied via Nginx: "/netmap/speedtest/target"
#   - Direct URL: "https://speedtest.example.com" or "http://192.168.1.50:8081"
server_url = 
# Test phase duration in seconds (default: 5)
duration_seconds = 5
# Cooldown period for visitor (unauthenticated) tests in hours (default: 2)
# Operators and Administrators have no cooldown.
visitor_cooldown_hours = 2


